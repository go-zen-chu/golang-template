name: check-pr
# pull_request (not pull_request_target): PR code runs without secrets and
# with a read-only token, so a malicious fork PR cannot steal anything.
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  check-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
      - name: Test code
        run: go test -v ./...
